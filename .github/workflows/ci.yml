name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Verify module dependencies
        run: |
          go mod verify
          (cd ext && go mod verify)

      - name: Run go vet
        run: go vet ./... ./ext/...

      - name: Run tests with coverage and race detector
        run: go test -v -race -count=1 -coverprofile=coverage.out ./... ./ext/...

      - name: Report coverage summary
        run: go tool cover -func=coverage.out

  deadcode:
    name: Deadcode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Run deadcode check
        run: |
          output=$(go run golang.org/x/tools/cmd/deadcode@v0.51.0 -test ./... ./ext/...)
          if [ -n "$output" ]; then
            echo "Unreachable code detected:"
            echo "$output"
            exit 1
          fi

  golangci-lint:
    name: GolangCI-Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Run golangci-lint (core)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Run golangci-lint (ext)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: ext
